{% set version = "1.0.5.dev0" %}
{% set build = 0 %}

package:
  name: bacoli-py
  version: {{ version }}

source:
  path: ..

build:
  number: {{ build }}
  string: {{ target_platform | replace('-', '_') }}_py{{ python | replace('.', '') }}h{{ PKG_HASH }}_{{ build }}

requirements:
  host:
    - python
    - numpy >=2
    - meson-python
    - gfortran
    - {{ compiler('fortran') }}
  run:
    - python
    - numpy
    - libgfortran

test:
  imports:
    - bacoli_py

about:
  home: https://github.com/mrclary/bacoli_py
  description: |
    bacoli_py is a Python package for solving systems of 1D Parabolic
    Partial Differential Equations.
  summary: "Python wrapper for BACOLI Fortran solver"
