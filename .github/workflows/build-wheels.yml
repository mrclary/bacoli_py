name: Build wheels for bacoli-py

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
  release:
    types:
      - created
  workflow_dispatch:

jobs:
  build-wheels:
    name: ${{ matrix.os }} - Python ${{ matrix.python_version }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHON_VERSION: ${{ matrix.python_version }}
      DISTDIR: ${{ github.workspace }}/dist
      GITHUB_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        python_version: ['3.10']
        os: ['macos-26', 'ubuntu-latest', 'windows-latest']
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Build Environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: .github/build-environment.yml
          create-args: >-
            python=${{ matrix.python_version }}
            ${{ runner.os == 'macOS' && 'delocate' || '' }}
            ${{ runner.os == 'Windows' && 'delvewheel' || '' }}
            ${{ runner.os == 'Linux' && 'auditwheel<5.2.0' || '' }}

      - name: Update Environment
        run: |
          if [[ $RUNNER_OS = 'macOS' ]]; then
              echo 'Linking gfortran...'
              ln -s /opt/homebrew/bin/gfortran-15 /opt/homebrew/bin/gfortran
          fi

      - name: Show Environment
        run: |
          micromamba info
          micromamba list
          gfortran --version

      - name: Build Wheel
        run: |
          python -m pip wheel --no-build-isolation -v -w $DISTDIR .

      - name: Delocate Wheel
        run: |
          WHEEL=$(find $DISTDIR -name bacoli*.whl)

          zipinfo $WHEEL
          echo ''
          if [[ $RUNNER_OS = 'macOS' ]]; then
              delocate-listdeps --all $WHEEL
              echo ''
              delocate-wheel -v $WHEEL
              echo ''

              # macOS delocate renames the wheel
              WHEEL=$(find $DISTDIR -name bacoli*.whl)

              delocate-listdeps --all $WHEEL
          fi
          if [[ $RUNNER_OS = 'Windows' ]]; then
              opts=("--add-path" "build/lib.win*/bacoli_interface/.libs")
              delvewheel show ${opts[@]} $WHEEL
              echo ''
              delvewheel repair -v ${opts[@]} -w $DISTDIR $WHEEL
              echo ''
              delvewheel show ${opts[@]} $WHEEL
          fi
          if [[ $RUNNER_OS = 'Linux' ]]; then
              auditwheel show $WHEEL
              echo ''
              auditwheel repair -w $DISTDIR --plat linux_x86_64 $WHEEL
              echo ''
              auditwheel show $WHEEL
          fi
          echo ''
          zipinfo $WHEEL

          # Add these to GITHUB_ENV last because macOS renames the wheel
          echo "WHEEL=$WHEEL" >> $GITHUB_ENV
          echo "NAME=$(basename $WHEEL)" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          path: ${{ env.WHEEL }}
          name: ${{ env.NAME }}

      - name: Get Release
        if: github.event_name == 'release'
        id: get_release
        uses: bruceadams/get-release@v1.3.2

      - name: Upload Release Asset
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: ${{ env.WHEEL }}
          asset_name: ${{ env.NAME }}
          asset_content_type: application/zip
